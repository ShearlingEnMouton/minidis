name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup update stable
          rustup component add rustfmt clippy

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Clippy (lite)
        run: cargo clippy --no-default-features --all-targets -- -D warnings

      - name: Test (lite)
        run: cargo test --no-default-features

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set chart version
        run: sed -i "s/LOCAL_GIT_TAG/0.0.0/g" helm/minidis/Chart.yaml

      - name: Lint
        run: helm lint --strict helm/minidis

      - name: aof.fsync reaches the container as AOF_FSYNC
        run: |
          for policy in always everysec no; do
            printf 'aof:\n  fsync: %s\n' "$policy" > values-test.yaml
            for args in "--set aof.fsync=$policy" "-f values-test.yaml"; do
              helm template minidis helm/minidis $args --show-only templates/configmap.yaml \
                | grep -qx "  AOF_FSYNC: \"$policy\"" \
                || { echo "AOF_FSYNC is not $policy with $args"; exit 1; }
            done
          done

      - name: Invalid aof.fsync values are rejected
        run: |
          for value in yes true Always typo; do
            printf 'aof:\n  fsync: %s\n' "$value" > values-test.yaml
            for args in "--set aof.fsync=$value" "-f values-test.yaml"; do
              if helm template minidis helm/minidis $args > /dev/null 2>&1; then
                echo "aof.fsync=$value was accepted with $args"
                exit 1
              fi
            done
          done

      - name: connectionLimit reaches the container
        run: |
          out=$(helm template minidis helm/minidis \
            --set connectionLimit.maxClients=50 --set connectionLimit.idleTimeout=0 \
            --show-only templates/configmap.yaml)
          grep -qx '  MAX_CLIENTS: "50"' <<< "$out" || { echo "MAX_CLIENTS is not 50"; exit 1; }
          grep -qx '  IDLE_TIMEOUT: "0"' <<< "$out" || { echo "IDLE_TIMEOUT is not 0"; exit 1; }

      - name: Invalid connectionLimit values are rejected
        run: |
          for args in "connectionLimit.maxClients=0" "connectionLimit.maxClients=abc" \
                      "connectionLimit.idleTimeout=-1" "connectionLimit.idleTimeout=1.5"; do
            if helm template minidis helm/minidis --set "$args" > /dev/null 2>&1; then
              echo "$args was accepted"
              exit 1
            fi
          done

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup update stable
          rustup component add llvm-tools-preview

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Measure coverage (full and lite)
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --no-report
          cargo llvm-cov --no-report --no-default-features
          cargo llvm-cov report --lcov --output-path lcov.info

      - name: Coverage summary
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          {
            echo '## Coverage'
            echo '```'
            cargo llvm-cov report
            echo '```'
            echo
            echo "![Coverage by file](https://codecov.io/gh/ShearlingEnMouton/minidis/commit/${COMMIT_SHA}/graphs/tree.svg?token=ZCPNPLYSG2)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: lcov
          path: lcov.info

      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          use_oidc: true
          fail_ci_if_error: true
