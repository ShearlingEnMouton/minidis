name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            cargo_flags: ""
            suffix: ""
            latest: auto
          - variant: lite
            cargo_flags: "--no-default-features"
            suffix: "-lite"
            latest: "false"
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/minidis
          tags: type=semver,pattern={{version}}
          flavor: |
            latest=${{ matrix.latest }}
            suffix=${{ matrix.suffix }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: CARGO_FLAGS=${{ matrix.cargo_flags }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

  chart:
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@v7

      - name: Resolve names
        run: |
          echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Set chart version
        run: sed -i "s/LOCAL_GIT_TAG/${VERSION}/g" helm/minidis/Chart.yaml

      - name: Lint
        run: helm lint helm/minidis

      - name: Login to ghcr
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Package and push
        run: |
          helm package helm/minidis --destination dist
          helm push dist/*.tgz "oci://ghcr.io/${OWNER}"

  release:
    runs-on: ubuntu-latest
    needs: [image, chart]
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAGS=""
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then FLAGS="--prerelease"; fi
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --generate-notes ${FLAGS}
