apiVersion: v1
kind: Service
metadata:
  name: "{{ include "minidisservice.name" . }}"
  labels:
{{ include "minidisservice.labels" . | indent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.port }}
  selector:
{{ include "minidisservice.matchLabels" . | indent 4 }}
