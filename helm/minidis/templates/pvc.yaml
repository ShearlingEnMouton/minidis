apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: "{{ include "minidisservice.name" . }}-pvc"
  annotations:
    helm.sh/resource-policy: keep
  labels:
{{ include "minidisservice.labels" . | indent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: {{ .Values.pvc.storage }}
