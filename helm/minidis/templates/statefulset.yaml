apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: "{{ include "minidisservice.name" . }}-sts"
  labels:
{{ include "minidisservice.labels" . | indent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  serviceName: {{ include "minidisservice.name" . }}-headless
  selector:
    matchLabels:
{{ include "minidisservice.matchLabels" . | indent 6 }}
  updateStrategy:
    type: {{ .Values.updateStrategy.type }}
  volumeClaimTemplates:
    - metadata:
        name: minidis-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: {{ .Values.pvc.storage }}
  template:
    metadata:
      labels:
{{ include "minidisservice.labels" . | indent 8 }}
      annotations:
        kubectl.kubernetes.io/default-logs-container: {{ include "minidisservice.name" . }}
    spec:
      terminationGracePeriodSeconds: {{ default 30 .Values.terminationGracePeriodSeconds }}
{{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
{{- end }}
{{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
{{- end }}
      containers:
      - name: {{ include "minidisservice.name" . }}
        image: {{ .Values.image.repository }}:{{ include "minidisservice.imageTag" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.port }}
        envFrom:
        - configMapRef:
            name: {{ include "minidisservice.name" . }}-cm
        startupProbe:
          {{- toYaml .Values.healthCheckCmd | nindent 10 }}
          periodSeconds: {{ .Values.startupProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds }}
          failureThreshold: {{ .Values.startupProbe.failureThreshold }}
        livenessProbe:
          {{- toYaml .Values.healthCheckCmd | nindent 10 }}
          periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
          failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
        readinessProbe:
          tcpSocket:
            port: {{ .Values.port }}
          initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
        volumeMounts:
          - name: minidis-data
            mountPath: /data
{{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
{{- end }}
{{- with .Values.lifecycle }}
        lifecycle:
          {{- toYaml . | nindent 10 }}
{{- end }}
{{- with .Values.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
{{- end }}
{{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
{{- end }}
{{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
{{- end }}
{{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
{{- end }}
