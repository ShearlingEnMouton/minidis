{{- if and .Values.auth.password (not .Values.auth.existingSecret) }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ include "minidisservice.secretName" . }}
  labels:
{{ include "minidisservice.labels" . | indent 4 }}
data:
  password: {{ .Values.auth.password | b64enc | quote }}
{{- end }}