nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/shearlingenmouton/minidis
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicas: 1

lifecycle:
  preStop:
    sleep:
      seconds: 15

bindAddress: 0.0.0.0
port: 3131
logLevel: INFO

purge:
  limit: 1000
  interval: 100

readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 10

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 3131

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}